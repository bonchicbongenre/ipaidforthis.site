<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I paid for this.</title>
<meta name="description" content="It was on sale.">
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/tokens.css?5">
<style>
body{margin:0;padding:3rem 16px 1.4rem;min-height:100svh;box-sizing:border-box;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:19px/1.5 var(--book);font-variant-numeric:oldstyle-nums}
main,.by{width:100%;max-width:46rem;margin:0 auto}
main{flex:1}
p{margin:0;line-height:1.35}
.label{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem}
.t{font-size:1.1rem}
.m{font-variant-caps:all-small-caps;letter-spacing:.04em}
.d{font-variant-numeric:lining-nums tabular-nums}
.l{margin-top:.5rem}
.go{margin-top:2rem}
button{font:inherit;font-size:.85rem;background:none;border:0;padding:0;color:var(--ru-base,var(--ink));cursor:pointer}
button:focus-visible{outline:1px solid var(--rule);outline-offset:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
a{color:var(--ru-accent);text-underline-offset:.15em}
.by{margin-top:3rem;text-align:right;font-size:.8rem}
</style>
</head>
<body>
<main>
<div class="label">
<div>
<p class="t">ipaidforthis.site</p>
<p class="m">a domain, a choice</p>
<p>2026</p>
<p class="d">$1.21</p>
<p class="l">It was on sale.</p>
</div>
<button id="theme" hidden>dark</button>
</div>
<p class="go"><a id="go" href="https://itsallinthe.name">itsallinthe.name</a></p>
<p class="sr" id="s" aria-live="polite"></p>
</main>
<p class="by">by <a href="https://github.com/bonchicbongenre/ipaidforthis.site">bonchicbongenre</a></p>
<script>
// elsewhere, at random: the link turns through the studio's sites, in the wall's order,
// this one among them, and stops on one, each as likely as the next; a moment later it
// goes there, replacing this page, so the way back does not come through here
var sites=["wevibe.fyi","meetingcouldhavebeenan.email","theresultisonthenext.page","itsthefloor.fyi","asciimoose.mov","doesthisdoanything.click","ipaidforthis.site","bumsf.art","whatsleftisright.com","itsallinthe.name","thepunchlineisinthe.link","thedomainisthejoke.com","thejokeisthedomain.com"],
    n=sites.length,a=document.getElementById("go"),
    calm=matchMedia("(prefers-reduced-motion: reduce)").matches,
    to=Math.floor(Math.random()*n),
    // where the turning starts, and how many names it passes: every one at least once
    at=calm?to:Math.floor(Math.random()*n),turns=calm?0:n+(to-at+n)%n,i=0,
    // it turns for 1.6 to 2.7 s, slowing evenly to a stop as a wheel does, so the i-th
    // name comes at spin*(1-sqrt(1-i/turns)); one time in four it seems to stop one
    // short, and then goes over
    spin=1600+1100*Math.random(),hang=Math.random()<.25?2.4:1,
    step=function(){
      var k=(at+i)%n;a.textContent=sites[k];a.href=sites[k]=="ipaidforthis.site"?"/":"https://"+sites[k]+"/";
      if(i<turns){i++;setTimeout(step,spin*(Math.sqrt(1-(i-1)/turns)-Math.sqrt(1-i/turns))*(i==turns?hang:1))}
      else{document.getElementById("s").textContent=sites[to];setTimeout(function(){location.replace(a.href)},900)}};
step();
// theme: the system's, until the visitor turns it; nothing is kept
var root=document.documentElement,sys=matchMedia("(prefers-color-scheme: dark)"),T=document.getElementById("theme"),
    dark=function(){var t=root.getAttribute("data-theme");return t?t=="dark":sys.matches},
    turn=function(){T.textContent=dark()?"light":"dark"};
sys.addEventListener("change",function(){if(!root.getAttribute("data-theme"))turn()});
T.onclick=function(){root.setAttribute("data-theme",dark()?"light":"dark");turn()};
turn();T.hidden=false;
</script>
</body>
</html>
